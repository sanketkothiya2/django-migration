{% extends 'myapp/base.html' %}

{% block title %}Register{% endblock %}

{% block body_block %}
<h1>Register</h1>
<form method="post" class="register-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>
<p>Already have an account? <a href="{% url 'myapp:login' %}">Login here</a>.</p>
{% endblock %}
